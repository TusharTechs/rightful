# Rightful on Render. One Blueprint provisions everything. Services are added here as they are
# built; docs/architecture.md shows the target layout and why each piece is separate.
projects:
  - name: rightful
    environments:
      - name: production
        envVarGroups:
          # Generated once on first deploy and shared by every service that needs them.
          - name: rightful-secrets
            envVars:
              - key: HUMAN_TAG_SECRET
                generateValue: true
              - key: ADMIN_TOKEN
                generateValue: true

        databases:
          # The ledger. A paid plan, because free databases are deleted after 30 days and judging
          # runs into mid-December.
          - name: rightful-db
            databaseName: rightful
            user: rightful
            plan: 0.1c-256mb
            region: oregon
            postgresMajorVersion: "18"
            # Private network only: nothing outside Render can connect.
            ipAllowList: []

        services:
          # Public API: claims, agents, ledgers, and the Log in with PayPal callback. Always on, so judges
          # never hit a cold start. Builds run the type checker and the test suite; a failing build
          # never deploys, and the pre-deploy migration runs before any new instance takes traffic.
          - type: web
            name: rightful-api
            runtime: node
            plan: 0.5c-512mb
            region: oregon
            branch: main
            autoDeployTrigger: commit
            buildCommand: npm ci --include=dev && npm run typecheck && npm test
            preDeployCommand: npm run migrate
            startCommand: npm start
            healthCheckPath: /health
            envVars:
              - key: NODE_VERSION
                value: "22"
              - key: NODE_ENV
                value: production
              - key: PAYPAL_ENV
                value: sandbox
              # Prompted once in the Dashboard when the Blueprint is first applied.
              - key: PAYPAL_CLIENT_ID
                sync: false
              - key: PAYPAL_CLIENT_SECRET
                sync: false
              - fromGroup: rightful-secrets
              - key: DATABASE_URL
                fromDatabase:
                  name: rightful-db
                  property: connectionString
              # Optional: the ring investigator (TypeSafe Jev). Without a key, rings carry evidence only.
              - key: TYPESAFE_API_KEY
                sync: false

          # Web app: programs, payout ledgers and the in-browser verifier. Static files only, so it
          # needs no server; the API URL is baked in at build time.
          - type: web
            name: rightful-web
            runtime: static
            buildCommand: npm ci --include=dev && npm run build:web
            staticPublishPath: web/dist
            pullRequestPreviewsEnabled: true
            routes:
              - type: rewrite
                source: /*
                destination: /index.html
            headers:
              - path: /*
                name: X-Frame-Options
                value: DENY
              - path: /*
                name: Referrer-Policy
                value: strict-origin-when-cross-origin
            envVars:
              - key: NODE_VERSION
                value: "22"
              - key: VITE_API_URL
                fromService:
                  name: rightful-api
                  type: web
                  envVarKey: RENDER_EXTERNAL_URL

          # The clock: every minute, read back payouts that are still moving and draw audit samples
          # whose drand round is out. Sandbox webhooks can lag by hours, so polling is the source of
          # truth. Every step is idempotent, so a slow tick overlapping the next is safe.
          - type: cron
            name: rightful-clock
            runtime: node
            region: oregon
            schedule: "* * * * *"
            buildCommand: npm ci --include=dev
            startCommand: npm run clock
            envVars:
              - key: NODE_VERSION
                value: "22"
              - key: NODE_ENV
                value: production
              - key: PAYPAL_ENV
                value: sandbox
              # Same PayPal app as the API, read from it so the secret is entered only once.
              - key: PAYPAL_CLIENT_ID
                fromService:
                  name: rightful-api
                  type: web
                  envVarKey: PAYPAL_CLIENT_ID
              - key: PAYPAL_CLIENT_SECRET
                fromService:
                  name: rightful-api
                  type: web
                  envVarKey: PAYPAL_CLIENT_SECRET
              - fromGroup: rightful-secrets
              - key: DATABASE_URL
                fromDatabase:
                  name: rightful-db
                  property: connectionString
