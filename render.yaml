# Firsthand on Render. One Blueprint provisions everything. Services are added here as they are
# built; docs/architecture.md shows the target layout and why each piece is separate.
projects:
  - name: firsthand
    environments:
      - name: production
        envVarGroups:
          # Generated once on first deploy and shared by every service that needs them.
          - name: firsthand-secrets
            envVars:
              - key: HUMAN_TAG_SECRET
                generateValue: true
              - key: ADMIN_TOKEN
                generateValue: true

        databases:
          # The ledger. A paid plan, because free databases are deleted after 30 days and judging
          # runs into mid-December.
          - name: firsthand-db
            databaseName: firsthand
            user: firsthand
            plan: 0.1c-256mb
            region: oregon
            postgresMajorVersion: "18"
            # Private network only: nothing outside Render can connect.
            ipAllowList: []

        services:
          # Public API: REST, PayPal return and Log in with PayPal callbacks. Always on, so judges
          # never hit a cold start. Builds run the type checker and the test suite; a failing build
          # never deploys, and the pre-deploy migration runs before any new instance takes traffic.
          - type: web
            name: firsthand-api
            runtime: node
            plan: 0.5c-512mb
            region: oregon
            branch: main
            autoDeployTrigger: commit
            buildCommand: npm ci --include=dev && npm run typecheck && npm test
            preDeployCommand: npm run migrate
            startCommand: npm start
            healthCheckPath: /health
            envVars:
              - key: NODE_VERSION
                value: "22"
              - key: NODE_ENV
                value: production
              - key: PAYPAL_ENV
                value: sandbox
              # Prompted once in the Dashboard when the Blueprint is first applied.
              - key: PAYPAL_CLIENT_ID
                sync: false
              - key: PAYPAL_CLIENT_SECRET
                sync: false
              - fromGroup: firsthand-secrets
              - key: DATABASE_URL
                fromDatabase:
                  name: firsthand-db
                  property: connectionString

          # Fan app: static files only, so it needs no server. The API URL is baked in at build
          # time. The API trusts this site's exact address through WEB_ORIGINS (set on the API),
          # never a name pattern, and never references this service, so there is no dependency cycle.
          - type: web
            name: firsthand-web
            runtime: static
            buildCommand: npm ci --include=dev && npm run build:web
            staticPublishPath: web/dist
            pullRequestPreviewsEnabled: true
            routes:
              - type: rewrite
                source: /*
                destination: /index.html
            headers:
              - path: /*
                name: X-Frame-Options
                value: DENY
              - path: /*
                name: Referrer-Policy
                value: strict-origin-when-cross-origin
            envVars:
              - key: NODE_VERSION
                value: "22"
              - key: VITE_API_URL
                fromService:
                  name: firsthand-api
                  type: web
                  envVarKey: RENDER_EXTERNAL_URL

          # The clock: every minute, seal ballots whose entries closed, draw ballots whose drand
          # round is out, and settle drawn ballots. The API also advances a ballot the moment someone
          # is watching it; this job is the backstop, so nothing waits on a visitor. Every step is
          # idempotent, so the two overlapping is safe.
          - type: cron
            name: firsthand-clock
            runtime: node
            region: oregon
            schedule: "* * * * *"
            buildCommand: npm ci --include=dev
            startCommand: npm run clock
            envVars:
              - key: NODE_VERSION
                value: "22"
              - key: NODE_ENV
                value: production
              - key: PAYPAL_ENV
                value: sandbox
              # Same PayPal app as the API, read from it so the secret is entered only once.
              - key: PAYPAL_CLIENT_ID
                fromService:
                  name: firsthand-api
                  type: web
                  envVarKey: PAYPAL_CLIENT_ID
              - key: PAYPAL_CLIENT_SECRET
                fromService:
                  name: firsthand-api
                  type: web
                  envVarKey: PAYPAL_CLIENT_SECRET
              - fromGroup: firsthand-secrets
              - key: DATABASE_URL
                fromDatabase:
                  name: firsthand-db
                  property: connectionString
